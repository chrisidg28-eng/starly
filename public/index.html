<div id="loader" role="status" aria-live="polite">

      <path d="M42 61 Q50 68 58 61" fill="none" stroke="#22303a" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
  </div>
  <div class="loader-name">starly</div>
  <div class="loader-bar"><i></i></div>
  <span class="sr-only">Cargando Starly…</span>
</div>
<script>
  setTimeout(function(){
    var l=document.getElementById("loader"); if(!l) return;
    l.classList.add("out"); setTimeout(function(){ l.remove(); }, 600);
  }, 3000);
</script>

</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
