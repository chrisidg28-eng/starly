<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starly · Cuenta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z' fill='%23ebe43f' stroke='%23ef8c47' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script>
  // Mismo tema que la app (se guarda en localStorage como "starly.theme")
  try { var t = localStorage.getItem("starly.theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #edebe4; --card: #f8f7f3; --ink: #22303a; --muted: #6a6e66; --line: #dbd7ca; --field: #e5e2d8;
    --accent: #0082b2; --accent-d: #00648a; --accent-ink: #ffffff; --orange: #ef8c47;
    --err: #b3401e; --ok: #3d7f27; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15191c; --card: #1e2428; --ink: #edebe4; --muted: #a3a69e; --line: #30383e; --field: #272e33;
    --accent: #1a9fd1; --accent-d: #0082b2; --accent-ink: #0b1c2a; --err: #ff9b7a; --ok: #8fd870; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #15191c; --card: #1e2428; --ink: #edebe4; --muted: #a3a69e; --line: #30383e; --field: #272e33;
    --accent: #1a9fd1; --accent-d: #0082b2; --accent-ink: #0b1c2a; --err: #ff9b7a; --ok: #8fd870; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 420px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 30px; color: var(--orange); text-decoration: none; }
  .brand svg { width: 34px; height: 34px; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; }
  .back { display: inline-block; margin-top: 16px; color: var(--muted); font-weight: 700; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 28px; animation: rise .4s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  h1 { font-family: "Baloo 2", sans-serif; font-size: 1.9rem; line-height: 1.1; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; line-height: 1.5; font-weight: 600; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--field); padding: 4px; border-radius: 12px; margin-bottom: 22px; }
  .tabs button { font: inherit; font-weight: 800; border: 0; background: transparent; color: var(--muted); padding: 9px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  label { display: block; font-size: 0.9rem; font-weight: 800; margin: 0 0 6px; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 2px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 14px; }
  input:focus { border-color: var(--accent); outline: none; background: var(--card); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { display: block; width: 100%; text-align: center; text-decoration: none; font: inherit; font-weight: 800; letter-spacing: .04em; border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 4px 0 var(--accent-d); }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .link { background: none; border: 0; font: inherit; font-weight: 700; color: var(--accent); padding: 0; cursor: pointer; text-decoration: underline; }
  .row { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
  .msg { min-height: 1.3em; margin: 14px 0 0; font-size: 0.9rem; line-height: 1.4; font-weight: 700; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none !important; }
  .who { padding: 14px; border: 2px solid var(--line); border-radius: 12px; margin-bottom: 18px; }
  .who strong { display: block; font-size: 1.1rem; }
  .who span { color: var(--muted); font-size: 0.9rem; word-break: break-all; }
  .go { margin-bottom: 18px; }
  @media (prefers-reduced-motion: no-preference) {
    .primary { transition: transform 0.12s ease, box-shadow .12s; }
    .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="brand" href="./" aria-label="Volver a Starly">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z" fill="#ebe43f" stroke="#ef8c47" stroke-width="5" stroke-linejoin="round"/></svg>
      starly
    </a>
    <button class="theme" id="theme" type="button" aria-label="Cambiar tema"></button>
  </div>

  <section class="card" id="guest" aria-live="polite">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Iniciar sesión</button>
      <button role="tab" id="tab-signup" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="form-login" novalidate>
      <h1>Bienvenido de vuelta</h1>
      <p class="sub">Entra con tu correo y contraseña.</p>
      <label for="l-email">Correo</label>
      <input id="l-email" type="email" autocomplete="email" required>
      <label for="l-pass">Contraseña</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Iniciar sesión</button>
      <p class="row"><button class="link" type="button" id="forgot">Olvidé mi contraseña</button></p>
    </form>

    <form id="form-signup" class="hidden" novalidate>
      <h1>Crea tu cuenta</h1>
      <p class="sub">Solo te toma un minuto. Te enviaremos un correo para confirmarla.</p>
      <label for="s-name">Nombre</label>
      <input id="s-name" type="text" autocomplete="name" required>
      <label for="s-email">Correo</label>
      <input id="s-email" type="email" autocomplete="email" required>
      <label for="s-pass">Contraseña (mínimo 6 caracteres)</label>
      <input id="s-pass" type="password" autocomplete="new-password" minlength="6" required>
      <button class="primary" type="submit">Crear cuenta</button>
    </form>

    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="card hidden" id="recovery">
    <h1>Nueva contraseña</h1>
    <p class="sub">Elige una contraseña nueva para tu cuenta.</p>
    <form id="form-recovery" novalidate>
      <label for="r-pass">Contraseña nueva</label>
      <input id="r-pass" type="password" autocomplete="new-password" minlength="6" required>
      <button class="primary" type="submit">Guardar contraseña</button>
    </form>
    <p class="msg" id="msg-recovery" role="status"></p>
  </section>

  <section class="card hidden" id="account">
    <h1 id="hello">Hola</h1>
    <p class="sub">Tu sesión está activa.</p>
    <div class="who"><strong id="who-name"></strong><span id="who-email"></span></div>
    <a class="primary go" href="./">Ir a Starly</a>
    <form id="form-profile" novalidate>
      <label for="p-name">Nombre</label>
      <input id="p-name" type="text" autocomplete="name">
      <button class="primary" type="submit">Guardar cambios</button>
    </form>
    <p class="row"><button class="link" type="button" id="logout">Cerrar sesión</button></p>
    <p class="msg" id="msg-account" role="status"></p>
  </section>

  <a class="back" href="./">← Volver a Starly</a>
</main>

<script>
  const SUPABASE_URL = 'https://dxltbofpzyffcbqwpwtw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9n1F7V2dUQYyQ5dD6xQTDQ_31ck857R';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const REDIRECT = location.origin + location.pathname;

  const ERRORS = {
    'Invalid login credentials': 'Correo o contraseña incorrectos.',
    'Email not confirmed': 'Primero confirma tu correo con el enlace que te enviamos.',
    'User already registered': 'Ya existe una cuenta con ese correo.',
    'Password should be at least 6 characters.': 'La contraseña debe tener al menos 6 caracteres.'
  };
  const say = (el, text, type) => { el.textContent = text || ''; el.className = 'msg ' + (type || ''); };
  const humanize = (e) => ERRORS[e.message] || e.message;
  const busy = (form, on) => form.querySelectorAll('button[type="submit"]').forEach(b => b.disabled = on);

  // Tema claro / oscuro (compartido con la app)
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  const paintTheme = () => { $('theme').textContent = isDark() ? '☀' : '☾'; $('theme').title = isDark() ? 'Modo claro' : 'Modo oscuro'; };
  $('theme').onclick = () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('starly.theme', next); } catch (e) {}
    paintTheme();
  };
  paintTheme();

  // Tabs
  function showTab(which) {
    const login = which === 'login';
    $('tab-login').setAttribute('aria-selected', login);
    $('tab-signup').setAttribute('aria-selected', !login);
    $('form-login').classList.toggle('hidden', !login);
    $('form-signup').classList.toggle('hidden', login);
    say($('msg'), '');
  }
  $('tab-login').onclick = () => showTab('login');
  $('tab-signup').onclick = () => showTab('signup');

  // Registro
  $('form-signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    busy(form, true);
    const { data, error } = await db.auth.signUp({
      email: $('s-email').value.trim(),
      password: $('s-pass').value,
      options: { data: { nombre: $('s-name').value.trim() }, emailRedirectTo: REDIRECT }
    });
    busy(form, false);
    if (error) return say($('msg'), humanize(error), 'err');
    // Si el correo ya existe, Supabase devuelve identities vacío
    if (data.user && data.user.identities && data.user.identities.length === 0) {
      return say($('msg'), 'Ya existe una cuenta con ese correo.', 'err');
    }
    if (data.session) return; // confirmación de correo desactivada: onAuthStateChange se encarga
    form.reset();
    say($('msg'), 'Cuenta creada. Revisa tu correo y toca el enlace para confirmarla.', 'ok');
  });

  // Login: al entrar, vuelve a la app
  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    busy(form, true);
    const { error } = await db.auth.signInWithPassword({
      email: $('l-email').value.trim(),
      password: $('l-pass').value
    });
    busy(form, false);
    if (error) return say($('msg'), humanize(error), 'err');
    say($('msg'), '¡Listo! Te llevamos a Starly…', 'ok');
    setTimeout(() => { location.href = './'; }, 900);
  });

  // Recuperar contraseña
  $('forgot').onclick = async () => {
    const email = $('l-email').value.trim();
    if (!email) return say($('msg'), 'Escribe tu correo arriba y vuelve a tocar “Olvidé mi contraseña”.', 'err');
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT });
    if (error) return say($('msg'), humanize(error), 'err');
    say($('msg'), 'Te enviamos un enlace para restablecer tu contraseña.', 'ok');
  };

  $('form-recovery').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await db.auth.updateUser({ password: $('r-pass').value });
    if (error) return say($('msg-recovery'), humanize(error), 'err');
    say($('msg-recovery'), 'Contraseña actualizada.', 'ok');
    setTimeout(() => render((window.__session) || null), 900);
  });

  // Perfil
  async function loadProfile(user) {
    const meta = (user.user_metadata && user.user_metadata.nombre) || '';
    let nombre = meta;
    const { data, error } = await db.from('profiles').select('nombre').eq('id', user.id).maybeSingle();
    if (!error && data && data.nombre) nombre = data.nombre;
    return nombre;
  }

  $('form-profile').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { data: { user } } = await db.auth.getUser();
    const nombre = $('p-name').value.trim();
    const { error } = await db.from('profiles').upsert({ id: user.id, nombre });
    if (error) return say($('msg-account'), 'No se pudo guardar: ' + error.message, 'err');
    // También en los metadatos de la sesión, para que la app muestre el nombre nuevo
    await db.auth.updateUser({ data: { nombre } });
    $('who-name').textContent = nombre || 'Sin nombre';
    $('hello').textContent = nombre ? 'Hola, ' + nombre : 'Hola';
    say($('msg-account'), 'Cambios guardados.', 'ok');
  });

  $('logout').onclick = () => db.auth.signOut();

  // Render según sesión
  async function render(session) {
    window.__session = session;
    $('recovery').classList.add('hidden');
    $('guest').classList.toggle('hidden', !!session);
    $('account').classList.toggle('hidden', !session);
    if (!session) return;
    const user = session.user;
    const nombre = await loadProfile(user);
    $('hello').textContent = nombre ? 'Hola, ' + nombre : 'Hola';
    $('who-name').textContent = nombre || 'Sin nombre';
    $('who-email').textContent = user.email;
    $('p-name').value = nombre;
    say($('msg-account'), '');
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      $('guest').classList.add('hidden');
      $('account').classList.add('hidden');
      $('recovery').classList.remove('hidden');
      window.__session = session;
      return;
    }
    // Evita llamadas a Supabase dentro del callback
    setTimeout(() => render(session), 0);
  });
</script>
</body>
</html>
